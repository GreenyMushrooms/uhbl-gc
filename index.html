<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UHBL Tracker</title>
<style>
:root{--bg:#000;--card:#0a0a0a;--line:#2a2a2a;--tx:#fff;--mut:#8a8a8a;--ok:#39ff14;--gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;--acc:#00e5ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--tx);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{font-size:0}
header,main{font-size:16px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main{position:relative;z-index:1}
header{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(0,0,0,.88);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;z-index:5}
.logo{font-weight:900;letter-spacing:.12em;font-size:18px}
.count{font-weight:800;color:var(--ok);text-shadow:0 0 10px rgba(57,255,20,.5);border:1px solid var(--ok);padding:6px 12px}
input,button,select{font:inherit;color:var(--tx);background:#000;border:1px solid var(--line);padding:8px 12px;border-radius:0}
input:focus{outline:1px solid var(--acc)}
button{cursor:pointer;text-transform:uppercase;font-size:12px;letter-spacing:.08em;font-weight:700}
button:hover{border-color:#fff}
button.on{background:#fff;color:#000;border-color:#fff}
.grp{display:flex}.grp button+button{border-left:0}
.sp{flex:1}
main{max-width:1400px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;transition:.3s}
.card.off{filter:grayscale(1);opacity:.45}
.card.on{border-color:var(--ok);box-shadow:0 0 18px rgba(57,255,20,.35),inset 0 0 22px rgba(57,255,20,.07)}
.top{display:flex;gap:14px;align-items:center}
.top svg{width:64px;height:64px;flex:none}
.nm{font-weight:800;font-size:17px;line-height:1.15}
.gm{color:var(--mut);font-size:13px;margin-top:3px}
.tag{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.14em;padding:4px 9px;border:1px solid var(--line);color:var(--mut)}
.on .tag{color:#000;background:var(--ok);border-color:var(--ok);box-shadow:0 0 12px var(--ok)}
.vic{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.chip{font-size:12px;border:1px solid #444;padding:3px 8px;display:flex;gap:6px;align-items:center}
.on .chip{border-color:var(--ok)}
.chip i{color:var(--mut);font-style:normal;font-size:11px}
.chip b{cursor:pointer;color:#f55}
.fc{color:var(--gold)}
.add{display:flex;gap:6px}.add input{flex:1;min-width:0}
.admin-tools{border-top:1px solid var(--line);padding-top:10px;margin-top:2px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}
.admin-tools .field{display:flex;flex-direction:column;gap:5px;min-width:0}
.admin-tools .field.id-field{grid-column:1/-1}
.admin-tools .field input,.admin-tools .field select{width:100%;min-width:0}
.admin-tools .field .lab{font-size:10px}
.admin-tools button{height:36px}
.admin-create{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:end}
.admin-create .field{display:flex;flex-direction:column;gap:5px;min-width:0}
.admin-create input,.admin-create select{width:100%;min-width:0;height:36px}
.admin-create button{height:36px;white-space:nowrap}
.delete-row{grid-column:1/-1;display:flex;justify-content:flex-end}
button.danger{border-color:#803333;color:#ff7777}
button.danger:hover{background:#ff5555;color:#000;border-color:#ff5555}
@media(max-width:760px){.admin-create{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.admin-create{grid-template-columns:1fr}}
.lab{font-size:11px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.panel{border:1px solid var(--line);background:rgba(10,10,10,.92);padding:16px;margin-bottom:16px;display:none;gap:10px;flex-wrap:wrap;align-items:center}
.panel.show{display:flex}
.panel input{min-width:200px}
.msg{width:100%;font-size:13px;color:var(--acc);white-space:pre-wrap}
.lb{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.lb h2{margin:0 0 12px;letter-spacing:.1em;font-size:16px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
.rk{font-weight:900;font-size:22px;width:34px;color:var(--mut)}
.row .n{flex:1;font-weight:700}.row .s{font-size:22px;font-weight:900}
.r1{border-color:var(--gold);box-shadow:0 0 20px rgba(255,215,0,.35)}.r1 .rk,.r1 .s{color:var(--gold)}
.r2{border-color:var(--silver);box-shadow:0 0 18px rgba(192,192,192,.3)}.r2 .rk,.r2 .s{color:var(--silver)}
.r3{border-color:var(--bronze);box-shadow:0 0 18px rgba(205,127,50,.3)}.r3 .rk,.r3 .s{color:var(--bronze)}
.empty{color:var(--mut);padding:30px;text-align:center;border:1px dashed var(--line)}
textarea{width:100%;min-height:90px;background:#000;color:#fff;border:1px solid var(--line);font:12px monospace;padding:8px}
.top img{width:64px;height:64px;flex:none;object-fit:cover;border:1px solid var(--line)}
.sep{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin-top:14px;font-weight:900;font-size:15px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;text-shadow:0 0 12px rgba(255,215,0,.45)}
.sep:first-child{margin-top:0}
.sep-count{flex:none;white-space:nowrap;font-size:13px;letter-spacing:.08em;color:var(--tx);text-shadow:none}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.tier{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--gold);margin-left:8px}
.rl{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.rl .grp{flex-wrap:wrap}.rl .grp button{border-left:1px solid var(--line)}
.rl .grp button.on{border-color:#fff}
#roll{font-size:16px;padding:14px 38px;border-color:var(--ok);color:var(--ok);box-shadow:0 0 14px rgba(57,255,20,.35)}
#roll:hover{background:var(--ok);color:#000}
#rres{width:100%;max-width:520px}
#rres .card{padding:22px}
#rres .top img,#rres .top svg{width:96px;height:96px}
#rres .nm{font-size:24px}
#rres .card.spin{border-color:var(--acc);box-shadow:0 0 18px rgba(0,229,255,.35)}
</style>
</head>

<canvas id="bg"></canvas>
<header>

      </select></label>
      <button id="createBadge" type="button">Create badge</button>
    </div>
    <div class="msg" id="amsg" aria-live="polite"></div>
  </div>
  <div id="view"></div>
  <datalist id="victorNames"></datalist>
</main>

  ${S.admin?`<div class="add"><input type="text" list="victorNames" placeholder="Type or select a victor name + Enter" data-in="${i}" aria-label="Victor name"><button data-add="${i}">Add</button></div>
  <div class="admin-tools">
    <div class="field id-field"><span class="lab">Roblox badge ID</span><input inputmode="numeric" placeholder="Enter badge ID" value="${esc(b.id||"")}" data-bid="${i}"></div>
    <button data-saveid="${i}">Save ID</button>
    <div class="field"><span class="lab">Difficulty tier</span><select data-tier="${i}">

  </div>`:""}</div>`}).join("")}</div>`:`<div class="empty">No badges match.</div>`}

S.rt="any";S.rs="any";S.rolling=false;
const pool=()=>S.badges.filter(b=>(S.rt=="any"||b.t===S.rt)&&(S.rs=="any"||(S.rs=="done")==!!b.victors.length));
function resCard(b,spin){const on=b.victors.length;
  return `<div class="card ${on?"on":"off"} ${spin?"spin":""}" style="${on?"":"filter:none;opacity:1"}"><div class="top">${icon(b)}<div><div class="nm">${esc(b.name)}</div><div class="gm">${esc(b.game)}${b.t!=null?`<span class="tier">${TL(b.t)}</span>`:""}</div></div></div>
  <div class="tag">${on?"CLEARED BY "+b.victors.length:"NOBODY HAS CLEARED THIS"}</div></div>`}
function roulette(){
  const tb=[["any","Any tier"],[0,"Entry level"],...[1,2,3,4,5,6].map(n=>[n,n+" ★"])];
  const sb=[["any","Any"],["todo","Not cleared"],["done","Cleared"]];
  const n=pool().length,tiered=S.badges.some(b=>b.t!=null);
  $("#view").innerHTML=`<div class="rl"><div><div class="lab" style="margin-bottom:8px">Difficulty</div><div class="grp">${tb.map(([k,l])=>`<button data-rt="${k}" class="${S.rt===k?"on":""}">${l}</button>`).join("")}</div></div>
  <div><div class="lab" style="margin-bottom:8px">Status</div><div class="grp">${sb.map(([k,l])=>`<button data-rs="${k}" class="${S.rs===k?"on":""}">${l}</button>`).join("")}</div></div>
  <div class="gm">${n} badge${n==1?"":"s"} match${tiered?"":" (no tiers set yet: assign difficulty tiers on the badge cards)"}</div>
  <button id="roll" data-roll="1">Roll</button><div id="rres">${S.roll!=null&&S.badges[S.roll]?resCard(S.badges[S.roll]):""}</div></div>`}
function doRoll(){if(S.rolling)return;const p=pool(),r=$("#rres");
  if(!p.length){r.innerHTML=`<div class="empty">No badges match these filters.</div>`;S.roll=null;return}
  S.rolling=true;let k=0;const final=p[Math.random()*p.length|0];
  const iv=setInterval(()=>{k++;if(k>=18){clearInterval(iv);S.rolling=false;S.roll=S.badges.indexOf(final);r.innerHTML=resCard(final);return}
    r.innerHTML=resCard(p[Math.random()*p.length|0],true)},70+k*6)}
document.addEventListener("click",e=>{const t=e.target;
  if(t.dataset.rt!=null){S.rt=t.dataset.rt=="any"?"any":+t.dataset.rt;S.roll=null;render()}
  if(t.dataset.rs!=null){S.rs=t.dataset.rs;S.roll=null;render()}
  if(t.dataset.roll)doRoll();
  if(t.dataset.add!=null){const inp=document.querySelector(`[data-in="${t.dataset.add}"]`);addVictor(+t.dataset.add,inp.value);render()}
  if(t.dataset.saveid!=null){const i=+t.dataset.saveid,inp=document.querySelector(`[data-bid="${i}"]`),id=inp.value.trim();if(id&&!/^\d+$/.test(id)){$("#amsg").textContent="Badge ID must contain numbers only.";return}S.badges[i].id=id||null;save();render();loadIcons();$("#amsg").textContent=id?`Saved badge ID ${id}. Loading its Roblox icon…`:"Badge ID removed."}
  if(t.dataset.deleteBadge!=null){
    if(!S.admin)return;
    const i=Number(t.dataset.deleteBadge),b=S.badges[i];
    if(b&&window.confirm(`Delete “${b.name}” from ${b.game}? This also removes its victor records.`)){
      if(!b.custom&&!S.deleted.includes(bk(b)))S.deleted.push(bk(b));
      S.badges.splice(i,1);S.roll=null;save();render();
      $("#amsg").textContent=`Deleted ${b.name}.`;
    }
  }
  if(t.dataset.rm){const[i,j]=t.dataset.rm.split(":");S.badges[i].victors.splice(+j,1);save();render()}
  if(t.dataset.f){S.f=t.dataset.f;document.querySelectorAll("#flt button").forEach(b=>b.classList.toggle("on",b===t));render()}
  if(t.dataset.t){S.tab=t.dataset.t;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b===t));render()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.tier!=null){const i=+t.dataset.tier;S.badges[i].t=t.value===""?null:Number(t.value);save();render();$("#amsg").textContent="Tier saved."}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.dataset.in!=null){addVictor(+e.target.dataset.in,e.target.value);render()}if(e.key=="Enter"&&e.target.dataset.bid!=null){const i=+e.target.dataset.bid;document.querySelector(`[data-saveid="${i}"]`).click()}});
$("#q").oninput=e=>{S.q=e.target.value;render()};
$("#adm").onclick=async e=>{const btn=e.currentTarget,want=!S.admin;
  if(window.LIVE){if(want){if(!(await window.fbLogin())){if(window.ADMIN_UID)$("#amsg").textContent="That Google account isn't the admin.";$("#apanel").classList.add("show");return}}else window.fbLogout()}
  S.admin=want;btn.textContent="Admin: "+(S.admin?"On":"Off");btn.classList.toggle("on",S.admin);$("#apanel").classList.toggle("show",S.admin);render()};
$("#createBadge").onclick=()=>{
  if(!S.admin)return;
  const game=$("#newGame").value.trim(),name=$("#newBadgeName").value.trim(),id=$("#newBadgeId").value.trim(),tier=$("#newBadgeTier").value;
  if(!game||!name){$("#amsg").textContent="Enter both a game name and a badge name.";return}
  if(id&&!/^\d+$/.test(id)){$("#amsg").textContent="Badge ID must contain numbers only.";return}
  const candidate={game,name};
  if(S.badges.some(b=>bk(b)===bk(candidate))){$("#amsg").textContent="That game and badge combination already exists.";return}
  const badge={...candidate,id:id||null,t:tier===""?null:Number(tier),victors:[],custom:true};
  S.badges.push(badge);save();
  $("#newGame").value="";$("#newBadgeName").value="";$("#newBadgeId").value="";$("#newBadgeTier").value="";
  S.tab="tr";document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==="tr"));
  render();loadIcons();$("#amsg").textContent=`Created ${name} in ${game}.`;
};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function jget(url){for(let a=0;a<4;a++){const r=await fetch(url);if(r.status==429){await sleep(2500*(a+1));continue}if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}throw new Error("rate limited")}

const cv=$("#bg"),cx=cv.getContext("2d");let W,H,P=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:Math.min(70,W/18|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,vx:(Math.random()-.5)*.25,vy:-Math.random()*.35-.05}))}
addEventListener("resize",size);size();let t=0;
function frame(){t+=.4;cx.clearRect(0,0,W,H);cx.strokeStyle="rgba(57,255,20,.13)";cx.lineWidth=1;const g=48,o=t%g;
  cx.beginPath();for(let x=-g+o;x<W;x+=g){cx.moveTo(x,0);cx.lineTo(x,H)}for(let y=-g+o;y<H;y+=g){cx.moveTo(0,y);cx.lineTo(W,y)}cx.stroke();
  const gr=cx.createLinearGradient(0,(t*2)%(H*2)-H,W,(t*2)%(H*2));gr.addColorStop(0,"rgba(0,229,255,0)");gr.addColorStop(.5,"rgba(0,229,255,.035)");gr.addColorStop(1,"rgba(0,229,255,0)");cx.fillStyle=gr;cx.fillRect(0,0,W,H);
  cx.fillStyle="rgba(255,255,255,.4)";P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.3);cx.fill()});
  requestAnimationFrame(frame)}
frame();render();loadIcons();
